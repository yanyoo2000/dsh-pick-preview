<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e97f0f'/%3E%3Cpath d='M10 23V10h6.5c3.6 0 5.8 2 5.8 5s-2.2 5-5.8 5H14v3z' fill='%23121212'/%3E%3C/svg%3E">
<title>DSH 插件排行 · dsh-pick</title>
<style>
{{CSS}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="top">
      <div class="logo">Pick</div>
      <div>
        <h1>DSH 插件<span class="hl">排行</span></h1>
        <div class="tagline">按去噪后的指标排：谁在被真正使用，一眼看得出来。</div>
      </div>
      <div class="meta" id="meta">正在加载目录…</div>
    </div>
  </div>

  <div class="section">
    <div class="filters" id="rankFilters">
      <button class="chip on" data-m="base">日常基线</button>
      <button class="chip" data-m="w">周下载</button>
      <button class="chip" data-m="growth">增速最快</button>
      <button class="chip" data-m="s">健康度</button>
      <select id="rankCat"></select>
    </div>
    <p class="cap" id="rankCap">日常基线已扣掉版本发布日与次日的拉取虚高，比原始下载量更接近真实使用量。</p>
    <div class="tblwrap">
      <table class="rank">
        <thead><tr>
          <th style="width:54px">排名</th><th>插件</th><th>分类</th>
          <th class="r">基线</th><th class="r">周下载</th><th class="r">环比</th>
          <th class="r" title="最近一次发版 · 平均几天发一个版本">更新</th><th></th>
        </tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>window.__DSH_PICK_CATALOG__ = {{DATA}};window.__DSH_PICK_INTRO__ = {{INTRO}};</script>
<script>
{{JS}}
</script>
</body>
</html>
