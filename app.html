<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e97f0f'/%3E%3Cpath d='M10 23V10h6.5c3.6 0 5.8 2 5.8 5s-2.2 5-5.8 5H14v3z' fill='%23121212'/%3E%3C/svg%3E"
    />
    <title>DSH 插件排行 · dsh-pick</title>
    <script>
      // 主题：尽早定下来，别等页面画完再切（会闪一下）
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('dsh-pick-theme')
        } catch (e) {}
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
